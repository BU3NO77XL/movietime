name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movietime_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: movietime_app/pubspec.yaml
          cache: true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Android signing secrets are not configured."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/movietime-release.jks
          cat > android/key.properties <<EOF
          storeFile=movietime-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed APK
        env:
          API_BASE_URL: ${{ secrets.MOVIETIME_API_BASE_URL }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define="MOVIETIME_API_BASE_URL=$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/movietime.apk"
          sha256sum build/app/outputs/flutter-apk/movietime.apk > build/app/outputs/flutter-apk/movietime.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            movietime_app/build/app/outputs/flutter-apk/movietime.apk
            movietime_app/build/app/outputs/flutter-apk/movietime.apk.sha256
          generate_release_notes: true